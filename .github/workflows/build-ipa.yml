name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ios-18-api-1-7-compat-6ip2w9

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project appdb.xcodeproj -scheme appdb

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project appdb.xcodeproj \
            -scheme appdb \
            -configuration Release \
            -archivePath "$PWD/build/appdb.xcarchive" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          set -euo pipefail
          cd build
          mkdir -p Payload
          cp -r appdb.xcarchive/Products/Applications/appdb.app Payload/
          zip -qr appdb-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdb-unsigned-ipa
          path: build/appdb-unsigned.ipa
          retention-days: 14

      - name: Publish release with IPA asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unsigned-ipa-run-${{ github.run_number }}
          name: "appdb unsigned IPA (build ${{ github.run_number }})"
          body: |
            Unsigned IPA built from commit ${{ github.sha }} (branch `${{ github.ref_name }}`).
            No code signature — sign it yourself (e.g. with Feather) before installing.
          files: build/appdb-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
